<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>{{ if .IsHome }}{{ site.Title }}{{ else }}{{ .Title }} — {{ site.Title }}{{ end }}</title>
<meta name="description" content="{{ with .Description }}{{ . }}{{ else }}{{ site.Params.description }}{{ end }}" />
{{ with site.Params.googleVerification }}<meta name="google-site-verification" content="{{ . }}" />{{ end }}
<!-- open graph -->
<meta property="og:title" content="{{ if .IsHome }}{{ site.Title }}{{ else }}{{ .Title }} — {{ site.Title }}{{ end }}" />
<meta property="og:description" content="{{ if .Description }}{{ .Description }}{{ else if .IsPage }}{{ .Summary | truncate 160 }}{{ else }}{{ site.Params.description }}{{ end }}" />
<meta property="og:type" content="{{ if .IsPage }}article{{ else }}website{{ end }}" />
<meta property="og:url" content="{{ .Permalink }}" />
<meta property="og:image" content="{{ site.BaseURL }}og.png" />
<meta name="twitter:card" content="summary_large_image" />
<meta name="twitter:image" content="{{ site.BaseURL }}og.png" />
<meta name="twitter:title" content="{{ if .IsHome }}{{ site.Title }}{{ else }}{{ .Title }} — {{ site.Title }}{{ end }}" />
<meta name="twitter:description" content="{{ if .Description }}{{ .Description }}{{ else if .IsPage }}{{ .Summary | truncate 160 }}{{ else }}{{ site.Params.description }}{{ end }}" />

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Amiri&family=Fira+Code:wght@400;600&display=swap" rel="stylesheet" />
{{ $css := resources.Get "css/styles.css" | css.TailwindCSS }}
<link rel="stylesheet" href="{{ $css.RelPermalink }}" />
<script defer src="https://cloud.umami.is/script.js" data-website-id="255134bf-20c7-4d59-8a3a-c4e065775ef2"></script>
