<header class="py-6 px-4">
  <nav class="mx-auto w-full max-w-4xl flex items-center gap-6">
    <a href="{{ "/" | relLangURL }}" class="nav-link hover:opacity-80 transition-opacity duration-150 text-[#c8a96e]">
      ~
    </a>
    {{ range site.Menus.main }}
    <a
      href="{{ .URL }}"
      {{ if strings.HasSuffix .URL ".pdf" }}target="_blank" rel="noopener"{{ end }}
      class="nav-link text-zinc-500 hover:text-white transition-colors duration-150 text-sm {{ if eq $.RelPermalink .URL }}text-white{{ end }}"
    >{{ .Name }}</a>
    {{ end }}
    <span class="flex-1"></span>
    {{/* TODO: arabic — uncomment when arabic content is ready
    {{ range .Translations }}
    <a href="{{ .RelPermalink }}" class="text-zinc-600 hover:text-zinc-300 transition-colors duration-150 text-xs">{{ .Language.LanguageName }}</a>
    {{ end }}
    */}}
  </nav>
</header>
