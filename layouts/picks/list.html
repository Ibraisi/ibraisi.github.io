{{ define "main" }}
<div class="space-y-8">
  <h1>{{ .Title }}</h1>
  {{ with .Content }}<div class="text-zinc-500 text-sm">{{ . }}</div>{{ end }}

  <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 border-t border-zinc-800 pt-6">
    {{ range .Sections }}
    <a href="{{ .RelPermalink }}" class="block group border border-zinc-800 p-5 hover:border-zinc-700 transition-colors">
      <p class="text-zinc-200 text-sm group-hover:text-white transition-colors" style="margin-bottom:0">{{ .Title }}</p>
      <p class="text-zinc-600 text-xs mt-2" style="margin-bottom:0">{{ len .Pages }} picks</p>
    </a>
    {{ end }}
  </div>
</div>
{{ end }}
